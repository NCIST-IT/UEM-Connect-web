<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>课表转 iCalendar</title>
    <style>
      body { max-width: 640px; margin: 64px auto; padding: 0 24px; font-family: system-ui, sans-serif; line-height: 1.7; color: #173038; }
      label, input, button { display: block; margin: 16px 0; }
      button { padding: 10px 20px; font: inherit; cursor: pointer; }
      #status { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>课表转 iCalendar</h1>
    <p>选择“我的课表”接口的原始 JSON，导出全学期 .ics 文件。日期按北京时间计算。</p>
    <p>读取、转换和下载均在浏览器中完成，文件不会上传。</p>
    <label for="timetable">原始课表 JSON</label>
    <input id="timetable" type="file" accept=".json,application/json,text/plain" />
    <button id="download" type="button" disabled>下载 .ics</button>
    <p id="status" role="status" aria-live="polite">请选择文件。</p>
    <script type="module" src="/src/timetable-converter.js"></script>
  </body>
</html>

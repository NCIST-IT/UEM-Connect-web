# Include inside nginx's http block. Serve only the built dist directory.
# When using an existing HTTPS virtual host, copy this server's locations and
# add_header directives into that virtual host instead of adding another listener.
server {
    listen 80;
    server_name _;
    root /srv/uem-connect-web/dist;
    index index.html;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'" always;

    # Browsers must not be granted cross-origin reads. Do not add Access-Control-Allow-*.
    # Block hidden files; ACME challenges may still be handled by the TLS frontend.
    location ~ /\. {
        deny all;
    }

    # Keep one canonical HTML URL so the cached HTML entry is predictable.
    location = /index.html {
        return 301 /$is_args$args;
    }

    # Hash routing does not require HTML fallback for missing files.
    location / {
        try_files $uri $uri/ =404;
    }
}
